# ── Cursor ───────────────────────────────────────────────────────────────────
$cursorTheme = Bibata-Accent
$cursorSize = 28

# ── Dropdown terminal (Super+`) ──────────────────────────────────────────────
windowrule = workspace special:term, match:class kitty-dropdown
windowrule = float true, match:class kitty-dropdown
windowrule = animation popin 80%, match:class kitty-dropdown

bind = Super, grave, exec, ~/.config/hypr/scripts/dropterm.sh
